# /etc/nginx/sites-available/crm  (ganti crm.example.com dan path sesuai server)
# Sertifikat: certbot --nginx -d crm.example.com

server {
    listen 80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.example.com;

    # Satu-satunya docroot. lib/, views/, config/, storage/ tidak bisa diakses dari web.
    root /var/www/crm/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 2m;

    # Kalau pakai Cloudflare proxy, aktifkan supaya IP asli tercatat (untuk rate limit dan audit).
    # Daftar IP terbaru: https://www.cloudflare.com/ips/
    # set_real_ip_from 173.245.48.0/20;
    # ... (semua range Cloudflare)
    # real_ip_header CF-Connecting-IP;

    location ~ /\. { deny all; }

    location = /ingest.php {
        client_max_body_size 64k;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Logo dan favicon dari bin/fetch-brand.php. SVG tidak boleh menjalankan script walau dibuka langsung.
    location /brand/ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
    }

    location /assets/ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # File PHP lain di public/ tidak ada; tolak supaya tidak ada eksekusi tak terduga.
    location ~ \.php$ { return 404; }
}
